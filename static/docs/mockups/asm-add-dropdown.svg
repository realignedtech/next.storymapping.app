    <path d="M788 19 h6 M788 24 h6 M798 17 l4 4 -4 4 M808 26 h-6 M808 21 h-6 M798 19 l-4 -4 4 -4" fill="none" stroke="#44546F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="830" y="10" width="36" height="28" rx="5" fill="#FFFFFF" stroke="#DCDFE4"/>
    <circle cx="843" cy="20" r="2.2" fill="#44546F"/>
