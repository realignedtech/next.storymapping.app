<svg width="880" height="440" viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="1" y="1" width="878" height="438" rx="8" fill="#FFFFFF" stroke="#DCDFE4"/>

  <!-- header bar -->
  <rect x="1" y="1" width="878" height="46" rx="8" fill="#FFFFFF"/>
  <line x1="1" y1="47" x2="879" y2="47" stroke="#DCDFE4"/>
  <rect x="14" y="13" width="20" height="20" rx="4" fill="#0C66E4"/>
  <text x="24" y="27" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">S</text>
  <text x="44" y="28" font-size="14" font-weight="600" fill="#172B4D">Checkout</text>
  <path d="M116 20 l4 5 h-8 z" fill="#6B778C"/>
  <g>
    <rect x="658" y="10" width="78" height="28" rx="5" fill="#0C66E4"/>
    <text x="672" y="28" font-size="12.5" font-weight="600" fill="#FFFFFF">TreeView</text>
    <path d="M720 21 l4 5 h-8 z" fill="#FFFFFF"/>
  </g>

  <!-- ===== tree table ===== -->
  <!-- table header -->
  <rect x="1" y="47" width="878" height="34" fill="#F7F8F9"/>
  <line x1="1" y1="81" x2="879" y2="81" stroke="#DCDFE4"/>
  <text x="24" y="69" font-size="12" font-weight="500" fill="#6B778C">Issue</text>
  <text x="300" y="69" font-size="12" font-weight="500" fill="#6B778C">Summary</text>
  <text x="700" y="69" font-size="12" font-weight="500" fill="#6B778C">Status</text>
  <!-- add column picker -->
  <rect x="846" y="55" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#DCDFE4"/>
  <path d="M852 67 h12 M858 61 v12" stroke="#44546F" stroke-width="1.5" stroke-linecap="round"/>

  <!-- row 1: activity -->
  <g>
    <rect x="1" y="81" width="878" height="38" fill="#FFFFFF"/>
    <path d="M28 96 l6 6 6 -6" fill="none" stroke="#44546F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="91" width="12" height="12" rx="2" fill="#206B8B"/>
    <text x="70" y="101" font-size="11" fill="#0C66E4" font-family="ui-monospace, Menlo, monospace">SHOP-88</text>
    <text x="300" y="101" font-size="12" font-weight="500" fill="#172B4D">Browse catalog</text>
  </g>
  <line x1="1" y1="119" x2="879" y2="119" stroke="#EBECF0"/>

  <!-- row 2: epic (indent 1) -->
  <g>
    <rect x="1" y="119" width="878" height="38" fill="#FFFFFF"/>
    <path d="M48 134 l6 6 6 -6" fill="none" stroke="#44546F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="129" width="12" height="12" rx="2" fill="#0C66E4"/>
    <text x="90" y="139" font-size="11" fill="#0C66E4" font-family="ui-monospace, Menlo, monospace">SHOP-12</text>
    <text x="300" y="139" font-size="12" font-weight="500" fill="#172B4D">Search products</text>
  </g>
  <line x1="1" y1="157" x2="879" y2="157" stroke="#EBECF0"/>

  <!-- row 3: issue (indent 2) -->
  <g>
    <rect x="1" y="157" width="878" height="38" fill="#FFFFFF"/>
    <rect x="92" y="167" width="12" height="12" rx="2" fill="#0C66E4"/>
