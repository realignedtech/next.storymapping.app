    <rect x="694" y="165" width="106" height="22" rx="4" fill="#F1F2F4"/>
    <circle cx="706" cy="176" r="4" fill="#1F845A"/>
    <text x="716" y="180" font-size="11" fill="#172B4D">Done</text>
  </g>
  <line x1="1" y1="195" x2="879" y2="195" stroke="#EBECF0"/>

  <!-- row 4: issue (indent 2) -->
  <g>
    <rect x="1" y="195" width="878" height="38" fill="#FFFFFF"/>
    <rect x="92" y="205" width="12" height="12" rx="2" fill="#0C66E4"/>
    <path d="M95.5 211 h5 M98 208.5 v5" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>
    <text x="110" y="215" font-size="11" fill="#0C66E4" font-family="ui-monospace, Menlo, monospace">SHOP-143</text>
    <text x="300" y="215" font-size="12" fill="#172B4D">Autocomplete query</text>
    <rect x="694" y="203" width="106" height="22" rx="4" fill="#F1F2F4"/>
    <circle cx="706" cy="214" r="4" fill="#2C5AA8"/>
    <text x="716" y="218" font-size="11" fill="#172B4D">In Progress</text>
  </g>
  <line x1="1" y1="233" x2="879" y2="233" stroke="#EBECF0"/>

  <!-- row 5: issue (indent 2) -->
  <g>
    <rect x="1" y="233" width="878" height="38" fill="#FFFFFF"/>
    <rect x="92" y="243" width="12" height="12" rx="2" fill="#0C66E4"/>
    <path d="M95.5 249 h5 M98 246.5 v5" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>
    <text x="110" y="253" font-size="11" fill="#0C66E4" font-family="ui-monospace, Menlo, monospace">SHOP-151</text>
    <text x="300" y="253" font-size="12" fill="#172B4D">Recent searches</text>
    <rect x="694" y="241" width="106" height="22" rx="4" fill="#F1F2F4"/>
    <circle cx="706" cy="252" r="4" fill="#758195"/>
    <text x="716" y="256" font-size="11" fill="#172B4D">To Do</text>
  </g>
  <line x1="1" y1="271" x2="879" y2="271" stroke="#EBECF0"/>

  <!-- row 6: epic (indent 1) -->
  <g>
    <rect x="1" y="271" width="878" height="38" fill="#FFFFFF"/>
    <path d="M31 283 l6 6 -6 6" fill="none" stroke="#44546F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="281" width="12" height="12" rx="2" fill="#0C66E4"/>
    <text x="90" y="291" font-size="11" fill="#0C66E4" font-family="ui-monospace, Menlo, monospace">SHOP-15</text>
    <text x="300" y="291" font-size="12" font-weight="500" fill="#172B4D">Filter results</text>
  </g>
  <line x1="1" y1="309" x2="879" y2="309" stroke="#EBECF0"/>

  <!-- row 7: issue under filter results (indent 2) -->
  <g>
    <rect x="1" y="309" width="878" height="38" fill="#FFFFFF"/>
    <rect x="92" y="319" width="12" height="12" rx="2" fill="#0C66E4"/>
    <path d="M95.5 325 h5 M98 322.5 v5" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>
    <text x="110" y="329" font-size="11" fill="#0C66E4" font-family="ui-monospace, Menlo, monospace">SHOP-118</text>
    <text x="300" y="329" font-size="12" fill="#172B4D">Price range filter</text>
    <rect x="694" y="317" width="106" height="22" rx="4" fill="#F1F2F4"/>
    <circle cx="706" cy="328" r="4" fill="#1F845A"/>
    <text x="716" y="332" font-size="11" fill="#172B4D">Done</text>
  </g>
  <line x1="1" y1="347" x2="879" y2="347" stroke="#EBECF0"/>

  <!-- row 8: activity 2 -->
  <g>
    <rect x="1" y="347" width="878" height="38" fill="#FFFFFF"/>
    <path d="M31 359 l6 6 -6 6" fill="none" stroke="#44546F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="357" width="12" height="12" rx="2" fill="#7A5AB8"/>
    <text x="70" y="367" font-size="11" fill="#0C66E4" font-family="ui-monospace, Menlo, monospace">SHOP-95</text>
    <text x="300" y="367" font-size="12" font-weight="500" fill="#172B4D">Checkout</text>
  </g>
  <line x1="1" y1="385" x2="879" y2="385" stroke="#EBECF0"/>

  <!-- row 9: unassigned group -->
  <g>
    <rect x="1" y="385" width="878" height="38" fill="#FFFFFF"/>
    <path d="M28 398 l6 6 6 -6" fill="none" stroke="#44546F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="300" y="405" font-size="12" font-weight="500" fill="#172B4D">Unassigned Epics</text>
  </g>
  <text x="440" y="434" font-size="12" fill="#6B778C" text-anchor="middle">TreeView shows the same work as a table — indented, with status at a glance</text>
</svg>
