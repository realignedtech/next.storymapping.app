<svg width="880" height="330" viewBox="0 0 880 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="1" y="1" width="878" height="328" rx="8" fill="#F7F8F9" stroke="#DCDFE4"/>

  <!-- header bar -->
  <rect x="1" y="1" width="878" height="46" rx="8" fill="#FFFFFF"/>
  <line x1="1" y1="47" x2="879" y2="47" stroke="#DCDFE4"/>
  <rect x="14" y="13" width="20" height="20" rx="4" fill="#0C66E4"/>
  <text x="24" y="27" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">S</text>
  <text x="44" y="28" font-size="14" font-weight="600" fill="#172B4D">Checkout</text>
  <path d="M116 20 l4 5 h-8 z" fill="#6B778C"/>

  <!-- toolbar, dimmed behind dropdown -->
  <g opacity="0.45">
    <rect x="560" y="10" width="30" height="28" rx="5" fill="#FFFFFF" stroke="#DCDFE4"/>
    <path d="M571 18 a6 6 0 1 1 -5.5 3.6" fill="none" stroke="#44546F" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="598" y="10" width="62" height="28" rx="5" fill="#0C66E4"/>
    <text x="612" y="28" font-size="12.5" font-weight="600" fill="#FFFFFF">Add</text>
    <path d="M647.5 21 l4 5 h-8 z" fill="#FFFFFF"/>
    <rect x="668" y="10" width="104" height="28" rx="5" fill="#FFFFFF" stroke="#DCDFE4"/>
    <text x="682" y="28" font-size="12.5" fill="#44546F">No swimlane</text>
    <path d="M756 21 l4 5 h-8 z" fill="#44546F"/>
    <rect x="780" y="10" width="42" height="28" rx="5" fill="#FFFFFF" stroke="#DCDFE4"/>
    <rect x="830" y="10" width="36" height="28" rx="5" fill="#FFFFFF" stroke="#DCDFE4"/>
  </g>

  <!-- open dropdown: plain text items -->
  <g>
    <rect x="598" y="44" width="172" height="128" rx="8" fill="#FFFFFF" stroke="#DCDFE4"/>
    <rect x="598" y="44" width="172" height="128" rx="8" fill="none" stroke="#8590A2" stroke-width="0.5"/>
    <rect x="604" y="52" width="160" height="34" rx="5" fill="#EDEFF3"/>
    <text x="620" y="74" font-size="12.5" fill="#172B4D">Add Activity</text>
    <text x="620" y="110" font-size="12.5" fill="#172B4D">Add Epic</text>
    <text x="620" y="146" font-size="12.5" fill="#172B4D">Add Story</text>
  </g>

  <!-- faded map behind -->
  <g opacity="0.3">
    <!-- activity cards -->
    <rect x="20" y="120" width="200" height="52" rx="3" fill="#FFFFFF" stroke="#DFE1E6"/>
    <rect x="20" y="120" width="4" height="52" fill="#206B8B"/>
    <text x="32" y="140" font-size="11" font-weight="500" fill="#172B4D">Browse catalog</text>
    <rect x="230" y="120" width="200" height="52" rx="3" fill="#FFFFFF" stroke="#DFE1E6"/>
    <rect x="230" y="120" width="4" height="52" fill="#7A5AB8"/>
    <text x="242" y="140" font-size="11" font-weight="500" fill="#172B4D">Checkout</text>
    <!-- epic cards -->
    <rect x="20" y="184" width="200" height="52" rx="3" fill="#FFFFFF" stroke="#DFE1E6"/>
    <rect x="20" y="184" width="4" height="52" fill="#0C66E4"/>
    <text x="32" y="204" font-size="11" font-weight="500" fill="#172B4D">Search products</text>
    <rect x="230" y="184" width="200" height="52" rx="3" fill="#FFFFFF" stroke="#DFE1E6"/>
    <rect x="230" y="184" width="4" height="52" fill="#7A5AB8"/>
    <text x="242" y="204" font-size="11" font-weight="500" fill="#172B4D">Cart</text>
    <!-- story cards -->
    <rect x="20" y="248" width="200" height="52" rx="3" fill="#FFFFFF" stroke="#DFE1E6"/>
    <text x="32" y="268" font-size="11" fill="#172B4D">Search bar on home</text>
    <rect x="230" y="248" width="200" height="52" rx="3" fill="#FFFFFF" stroke="#DFE1E6"/>
    <text x="242" y="268" font-size="11" fill="#172B4D">Add to cart</text>
  </g>

  <!-- caption -->
  <text x="440" y="316" font-size="12" fill="#6B778C" text-anchor="middle">The Add dropdown creates a new Jira issue directly at the right level of the map</text>
</svg>
