<svg width="880" height="420" viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="1" y="1" width="878" height="418" rx="8" fill="#F7F8F9" stroke="#DCDFE4"/>

  <!-- header bar -->
  <rect x="1" y="1" width="878" height="46" rx="8" fill="#FFFFFF"/>
  <line x1="1" y1="47" x2="879" y2="47" stroke="#DCDFE4"/>
  <rect x="14" y="10" width="64" height="28" rx="5" fill="#FFFFFF" stroke="#DCDFE4"/>
  <path d="M26 19 l-5 5 5 5" fill="none" stroke="#44546F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="38" y="28" font-size="12.5" fill="#44546F">Back</text>
  <text x="440" y="30" font-size="15" font-weight="600" fill="#172B4D" text-anchor="middle">Set up your Story Map</text>

  <!-- step 1: map type -->
  <text x="60" y="88" font-size="12" font-weight="700" fill="#6B778C">STEP 1</text>
  <text x="110" y="88" font-size="13.5" font-weight="600" fill="#172B4D">Choose the map type</text>

  <!-- dynamic card (selected) -->
  <rect x="60" y="104" width="360" height="104" rx="8" fill="#FFFFFF" stroke="#0C66E4" stroke-width="2"/>
  <circle cx="84" cy="128" r="9" fill="#0C66E4"/>
  <path d="M80 128 l3 3 5 -6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="102" y="133" font-size="13.5" font-weight="600" fill="#172B4D">Dynamic map</text>
  <text x="76" y="156" font-size="11.5" fill="#6B778C">Sourced from a Jira board. Issues, sprints, releases</text>
  <text x="76" y="172" font-size="11.5" fill="#6B778C">and quick filters stay in sync with the board.</text>
  <text x="76" y="194" font-size="11" fill="#0C66E4" font-weight="600">Recommended for most teams</text>

  <!-- static card -->
  <rect x="440" y="104" width="360" height="104" rx="8" fill="#FFFFFF" stroke="#DCDFE4"/>
  <circle cx="464" cy="128" r="9" fill="none" stroke="#C8CDD6" stroke-width="1.8"/>
  <text x="482" y="133" font-size="13.5" font-weight="600" fill="#172B4D">Static map</text>
  <text x="456" y="156" font-size="11.5" fill="#6B778C">A manually curated map. You pick the issue types,</text>
  <text x="456" y="172" font-size="11.5" fill="#6B778C">import issues once, and arrange them freely.</text>

  <!-- step 2: board -->
  <text x="60" y="248" font-size="12" font-weight="700" fill="#6B778C">STEP 2</text>
  <text x="110" y="248" font-size="13.5" font-weight="600" fill="#172B4D">Select the board</text>
  <rect x="60" y="264" width="400" height="36" rx="5" fill="#FFFFFF" stroke="#8590A2"/>
  <circle cx="76" cy="282" r="5" fill="none" stroke="#8590A2" stroke-width="1.5"/>
  <path d="M80 286 l5 5" stroke="#8590A2" stroke-width="1.5" stroke-linecap="round"/>
  <text x="94" y="287" font-size="12.5" fill="#172B4D">Web Shop Scrum</text>
  <path d="M186 292 l10 -6 v12 z" fill="#DCDFE4" transform="rotate(90 191 286)"/>

  <!-- board result row -->
  <rect x="60" y="308" width="400" height="36" rx="5" fill="#E9F2FF" stroke="#0C66E4"/>
  <rect x="68" y="316" width="20" height="20" rx="4" fill="#0C66E4"/>
  <path d="M73 326 h10 M78 321 v10" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <text x="96" y="331" font-size="12.5" fill="#172B4D">Web Shop Scrum</text>
  <text x="448" y="331" font-size="10" fill="#6B778C" text-anchor="end">Scrum board</text>

  <!-- step 3: backbone -->
  <text x="540" y="248" font-size="12" font-weight="700" fill="#6B778C">STEP 3</text>
  <text x="590" y="248" font-size="13.5" font-weight="600" fill="#172B4D">Confirm the backbone type</text>
  <rect x="540" y="264" width="320" height="36" rx="5" fill="#FFFFFF" stroke="#8590A2"/>
  <rect x="548" y="272" width="20" height="20" rx="3" fill="#0C66E4"/>
  <path d="M552.5 282 h11 M558 276.5 v11" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <text x="576" y="287" font-size="12.5" fill="#172B4D">Epic (suggested)</text>
  <path d="M840 278 l6 7 h-12 z" fill="#44546F"/>
  <text x="540" y="332" font-size="11" fill="#6B778C">You can change types and links later under</text>
  <text x="540" y="348" font-size="11" fill="#6B778C">Settings → Hierarchy.</text>

  <!-- create button -->
  <rect x="60" y="364" width="90" height="32" rx="5" fill="#0C66E4"/>
  <text x="79" y="384" font-size="12.5" font-weight="600" fill="#FFFFFF">Create</text>
</svg>
