<svg width="880" height="440" viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="1" y="1" width="878" height="438" rx="8" fill="#F7F8F9" stroke="#DCDFE4"/>

  <!-- header bar -->
  <rect x="1" y="1" width="878" height="46" rx="8" fill="#FFFFFF"/>
  <line x1="1" y1="47" x2="879" y2="47" stroke="#DCDFE4"/>
  <rect x="14" y="13" width="20" height="20" rx="4" fill="#0C66E4"/>
  <text x="24" y="27" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">S</text>
  <text x="44" y="28" font-size="14" font-weight="600" fill="#172B4D">Checkout</text>
  <path d="M116 20 l4 5 h-8 z" fill="#6B778C"/>
  <!-- Dependencies toolbar button, active -->
  <rect x="700" y="10" width="120" height="28" rx="5" fill="#E9F2FF" stroke="#0C66E4"/>
  <path d="M712 19 h6 M712 24 h6 M722 17 l4 4 -4 4 M732 26 h-6 M732 21 h-6 M722 19 l-4 -4 4 -4" fill="none" stroke="#0C66E4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="742" y="28" font-size="12.5" font-weight="600" fill="#0C66E4">Dependencies</text>

  <!-- ===== map cards ===== -->
  <!-- connected card: amber border -->
  <g>
    <rect x="40" y="90" width="170" height="56" rx="3" fill="#FFFFFF" stroke="#FFC107" stroke-width="3"/>
    <text x="52" y="110" font-size="11" fill="#172B4D">Autocomplete query</text>
    <rect x="52" y="122" width="10" height="10" rx="2" fill="#0C66E4"/>
    <text x="66" y="131" font-size="9.5" fill="#0C66E4" font-family="ui-monospace, Menlo, monospace">SHOP-143</text>
    <circle cx="196" cy="127" r="7" fill="#7A5AB8"/>
    <text x="196" y="130" font-size="7" fill="#FFFFFF" text-anchor="middle" font-weight="600">AK</text>
    <rect x="198" y="123" width="10" height="10" rx="2" fill="#2C5AA8"/>
  </g>

  <!-- dimmed card (not connected) -->
  <g opacity="0.5">
    <rect x="40" y="176" width="170" height="56" rx="3" fill="#FFFFFF" stroke="#DFE1E6"/>
    <text x="52" y="196" font-size="11" fill="#172B4D">Recent searches</text>
    <rect x="52" y="208" width="10" height="10" rx="2" fill="#0C66E4"/>
    <text x="66" y="217" font-size="9.5" fill="#0C66E4" font-family="ui-monospace, Menlo, monospace">SHOP-151</text>
    <rect x="196" y="209" width="10" height="10" rx="2" fill="#758195"/>
  </g>

  <!-- connected card -->
  <g>
    <rect x="290" y="130" width="170" height="56" rx="3" fill="#FFFFFF" stroke="#FFC107" stroke-width="3"/>
    <text x="302" y="150" font-size="11" fill="#172B4D">Add to cart</text>
    <rect x="302" y="162" width="10" height="10" rx="2" fill="#7A5AB8"/>
    <text x="316" y="171" font-size="9.5" fill="#0C66E4" font-family="ui-monospace, Menlo, monospace">SHOP-201</text>
    <circle cx="446" cy="167" r="7" fill="#2E7D57"/>
    <text x="446" y="170" font-size="7" fill="#FFFFFF" text-anchor="middle" font-weight="600">MT</text>
    <rect x="448" y="163" width="10" height="10" rx="2" fill="#2C5AA8"/>
  </g>

  <!-- dimmed card -->
  <g opacity="0.5">
    <rect x="290" y="216" width="170" height="56" rx="3" fill="#FFFFFF" stroke="#DFE1E6"/>
    <text x="302" y="236" font-size="11" fill="#172B4D">Saved carts</text>
    <rect x="302" y="248" width="10" height="10" rx="2" fill="#7A5AB8"/>
    <text x="316" y="257" font-size="9.5" fill="#0C66E4" font-family="ui-monospace, Menlo, monospace">SHOP-210</text>
    <rect x="446" y="249" width="10" height="10" rx="2" fill="#758195"/>
  </g>

  <!-- connected card -->
  <g>
    <rect x="540" y="170" width="170" height="56" rx="3" fill="#FFFFFF" stroke="#FFC107" stroke-width="3"/>
    <text x="552" y="190" font-size="11" fill="#172B4D">Credit card form</text>
    <rect x="552" y="202" width="10" height="10" rx="2" fill="#7A5AB8"/>
    <text x="566" y="211" font-size="9.5" fill="#0C66E4" font-family="ui-monospace, Menlo, monospace">SHOP-231</text>
    <circle cx="696" cy="207" r="7" fill="#7A5AB8"/>
    <text x="696" y="210" font-size="7" fill="#FFFFFF" text-anchor="middle" font-weight="600">AK</text>
    <rect x="698" y="203" width="10" height="10" rx="2" fill="#1F845A"/>
  </g>

  <!-- ===== dependency curves (blue, bezier, dot at end) ===== -->
  <path d="M 210 118 C 262 118, 238 158, 290 158" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.85"/>
  <circle cx="290" cy="158" r="3" fill="#3B82F6" opacity="0.8"/>

  <!-- SHOP-201 (460, 158) -> SHOP-231 left edge center (540, 198) -->
  <path d="M 460 158 C 512 158, 488 198, 540 198" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.85"/>
  <circle cx="540" cy="198" r="3" fill="#3B82F6" opacity="0.8"/>

  <!-- ===== dependencies configuration panel ===== -->
  <g>
    <rect x="560" y="52" width="304" height="120" rx="8" fill="#FFFFFF" stroke="#DCDFE4"/>
    <line x1="560" y1="92" x2="864" y2="92" stroke="#DCDFE4"/>
    <path d="M580 72 h6 M580 78 h6 M590 68 l5 5 -5 5 M600 82 h-6 M600 74 h-6 M590 72 l-5 -5 5 -5" fill="none" stroke="#44546F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="610" y="78" font-size="13" font-weight="600" fill="#172B4D">Dependencies Configuration</text>
    <path d="M848 64 l8 8 m0 -8 l-8 8" stroke="#6B778C" stroke-width="1.5" stroke-linecap="round"/>

    <text x="576" y="112" font-size="11.5" fill="#44546F">Link type</text>
    <rect x="576" y="122" width="272" height="32" rx="5" fill="#F7F8F9" stroke="#8590A2"/>
    <text x="588" y="142" font-size="12.5" fill="#172B4D">blocks</text>
    <path d="M830 134 l5 6 h-10 z" fill="#44546F"/>
  </g>

  <!-- legend -->
  <g>
    <rect x="20" y="392" width="8" height="8" rx="1.5" fill="none" stroke="#FFC107" stroke-width="2"/>
    <text x="36" y="401" font-size="11" fill="#6B778C">linked issue</text>
    <line x1="120" y1="396" x2="150" y2="396" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="150" cy="396" r="3" fill="#3B82F6"/>
    <text x="158" y="401" font-size="11" fill="#6B778C">dependency line, drawn from the issue links you configure — here "blocks"</text>
  </g>
</svg>
