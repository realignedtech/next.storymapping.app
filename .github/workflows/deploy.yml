name: Deploy

# Build an arm64 image, publish to GHCR, then run one forced SSH command on the
# arm64 host to pull the exact commit tag and restart. See the sibling
# realigned-website repo, deploy/README.md, for the one-time host setup and the
# rationale for the pull model over "push the image over SSH".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-storymapping
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/realignedtech/storymapping

jobs:
  build:
    name: Build arm64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: scripts/generate-sitemap.mjs dates each URL by the
          # last commit that touched its route. A shallow clone has one commit,
          # so every <lastmod> became the deploy commit's time.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build and test
        run: |
          npm ci
          npm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Containerfile's COPY paths are relative to a staged context
      # (Containerfile, Caddyfile, build/) -- the same layout scripts/deploy.sh
      # assembles. Reproduce it here; the base image is multi-arch and there are
      # no RUN steps, so no QEMU is needed.
      - name: Stage build context
        run: |
          mkdir -p .ci-context
          cp deploy/Containerfile .ci-context/Dockerfile
          cp deploy/Caddyfile .ci-context/Caddyfile
          cp -r build .ci-context/build

      # A Caddyfile error would otherwise ship and stop the site at restart.
      # Validate with the exact Caddy image the Containerfile pins (the same
      # check scripts/deploy.sh runs), so a bad config fails here instead.
      - name: Validate the Caddyfile
        run: |
          image="$(sed -n 's/^FROM //p' deploy/Containerfile)"
          docker run --rm -v "$PWD/.ci-context/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - uses: docker/build-push-action@v6
        with:
          context: .ci-context
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          provenance: true
          sbom: true

  deploy:
    name: Pull and restart on windshift.sh
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Trigger pull and restart
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              core@windshift.sh "storymapping sha-${{ github.sha }}"

  verify:
    name: Verify live
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The repo's own verifier: every sitemap route 200, trailing-slash
      # canonicalization, and the open-redirect guard (a backslash must never be
      # echoed into a Location header).
      - run: node scripts/verify-production.mjs https://storymapping.app

      - name: Confirm the shared host is unaffected
        run: test "$(curl -s -o /dev/null -w '%{http_code}' https://windshift.sh/)" = 200
